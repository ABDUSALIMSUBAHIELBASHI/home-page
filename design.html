<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat 2025 | Obsidian Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        accent: '#10b981', // Emerald 500
                        accentHover: '#059669', // Emerald 600
                        surface: '#09090b', // Zinc 950
                        surfaceHighlight: '#18181b', // Zinc 900
                    },
                    backgroundImage: {
                        'dot-pattern': "radial-gradient(#27272a 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        
        /* Technical Grid Background */
        .bg-grid {
            background-color: #000000;
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .light .bg-grid {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Code Blocks */
        .prose pre {
            background: #000;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .prose code {
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(16, 185, 129, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 0.25rem;
        }

        /* Typing Cursor Block */
        .cursor-block::after {
            content: '';
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: #10b981;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>

<body class="bg-white dark:bg-black text-zinc-800 dark:text-zinc-200 transition-colors duration-300 overflow-hidden selection:bg-accent selection:text-black">

    <div class="flex h-screen relative">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-zinc-50 dark:bg-surface border-r border-zinc-200 dark:border-zinc-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
            
            <div class="h-16 flex items-center px-6 border-b border-zinc-200 dark:border-zinc-800">
                <div class="w-3 h-3 bg-accent rounded-full mr-3 animate-pulse"></div>
                <span class="font-mono font-bold tracking-wider text-lg">SYS.CHAT_V2</span>
            </div>

            <div class="p-4">
                <button id="new-chat-btn" class="w-full bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 hover:border-accent dark:hover:border-accent text-sm font-mono py-3 px-4 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 group">
                    <span>[+]</span>
                    <span>INITIALIZE_NEW</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-2 space-y-1" id="history-container">
                <div class="text-[10px] font-mono text-zinc-400 uppercase mb-2 tracking-widest">Log_History</div>
                </div>

            <div class="p-4 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-zinc-900/50">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-mono text-zinc-500">MODE:</span>
                    <button id="theme-toggle" class="text-xs font-mono bg-zinc-200 dark:bg-zinc-800 px-2 py-1 rounded hover:text-accent transition">
                        DARK_OS
                    </button>
                </div>
                <button id="clear-storage-btn" class="w-full text-xs font-mono text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 py-2 rounded transition text-left px-2">
                    > PURGE_DATA
                </button>
                <button id="contact-toggle-btn" class="w-full text-xs font-mono text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-800 py-2 rounded transition text-left px-2 mt-1">
                    > DEV_CONTACT
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative w-full bg-grid">
            
            <header class="md:hidden h-14 border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-black/80 backdrop-blur flex items-center justify-between px-4 sticky top-0 z-30">
                <button id="open-sidebar-btn" class="text-zinc-500 hover:text-accent">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <span class="font-mono text-sm font-bold">SYS.CHAT_V2</span>
                <div class="w-6"></div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 pb-32 sm:p-10 sm:pb-32 space-y-8 scroll-smooth">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center opacity-100">
                    <div class="w-16 h-16 border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 rounded-2xl flex items-center justify-center mb-6 shadow-xl">
                        <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">System Ready.</h1>
                    <p class="text-zinc-500 dark:text-zinc-400 max-w-md font-mono text-sm">
                        Enter command or query. <br>
                        <span class="text-accent">LaTeX</span> enabled. <span class="text-accent">Markdown</span> supported.
                    </p>
                </div>
            </div>

            <div class="absolute bottom-6 left-0 right-0 px-4 z-20 flex justify-center">
                <div class="w-full max-w-3xl bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md border border-zinc-200 dark:border-zinc-700 rounded-2xl shadow-2xl p-2 flex flex-col gap-2 transition-all focus-within:border-accent dark:focus-within:border-accent focus-within:ring-1 focus-within:ring-accent">
                    
                    <div id="image-preview" class="px-2 pt-2 empty:hidden flex items-center gap-2"></div>

                    <div class="flex items-end gap-2">
                        <button id="attach-button" class="p-3 text-zinc-400 hover:text-zinc-800 dark:hover:text-white transition-colors" title="Upload Image">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </button>
                        <input type="file" id="file-input" accept="image/*" class="hidden">

                        <textarea id="user-input" rows="1" placeholder="Type your message..." class="w-full bg-transparent border-none text-zinc-800 dark:text-zinc-100 placeholder-zinc-400 focus:ring-0 resize-none py-3 max-h-32 font-sans"></textarea>

                        <button id="send-button" disabled class="p-2 mr-1 mb-1 bg-accent text-black font-bold rounded-xl hover:bg-accentHover disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden backdrop-blur-sm"></div>

        </main>
    </div>

    <div id="contact-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-lg w-full max-w-sm shadow-2xl relative">
            <button id="close-contact-modal-btn" class="absolute top-3 right-3 text-zinc-500 hover:text-white">&times;</button>
            <h3 class="text-xl font-mono font-bold text-white mb-4 border-b border-zinc-800 pb-2">> CONTACT_INFO</h3>
            <div class="space-y-4 font-mono text-sm text-zinc-300">
                <div>
                    <p class="text-zinc-500 text-xs uppercase">Email</p>
                    <p class="text-accent">salimabdu759@gmail.com</p>
                </div>
                <div>
                    <p class="text-zinc-500 text-xs uppercase">Mobile</p>
                    <p class="text-accent">+250739390715</p>
                </div>
                <div>
                    <p class="text-zinc-500 text-xs uppercase">Location</p>
                    <p>RWANDA-KIGALI</p>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmation-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-lg w-full max-w-sm text-center">
            <h3 class="text-lg font-bold text-white mb-2">Confirm Deletion</h3>
            <p class="text-zinc-400 text-sm mb-6">This will permanently wipe all local logs.</p>
            <div class="flex gap-3">
                <button id="modal-cancel" class="flex-1 py-2 border border-zinc-600 rounded hover:bg-zinc-800 text-zinc-300 text-sm">Cancel</button>
                <button id="modal-confirm" class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-bold">EXECUTE</button>
            </div>
        </div>
    </div>

<script>
    /* --- UI ELEMENTS --- */
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const chatContainer = document.getElementById('chat-container');
    const newChatBtn = document.getElementById('new-chat-btn');
    const themeToggle = document.getElementById('theme-toggle');
    const clearStorageBtn = document.getElementById('clear-storage-btn');
    const contactModal = document.getElementById('contact-modal');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    /* --- STATE --- */
    let currentChatHistory = [];
    let chats = JSON.parse(localStorage.getItem('chats_v2')) || []; // Using v2 key to separate from previous code
    let currentChatId = null;

    /* --- THEME LOGIC --- */
    function initTheme() {
        const savedTheme = localStorage.getItem('theme_v2') || 'dark';
        if(savedTheme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        themeToggle.textContent = savedTheme === 'dark' ? 'LIGHT_MODE' : 'DARK_MODE';
    }
    
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme_v2', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? 'LIGHT_MODE' : 'DARK_MODE';
    });

    /* --- CHAT LOGIC --- */
    function saveState() {
        if (currentChatHistory.length > 0) {
            let chatIndex = chats.findIndex(c => c.id === currentChatId);
            if (chatIndex === -1) {
                const chatName = currentChatHistory[0].text.substring(0, 20).toUpperCase() + '...';
                const newChat = { name: chatName, id: Date.now(), history: currentChatHistory };
                chats.push(newChat);
                currentChatId = newChat.id;
            } else {
                chats[chatIndex].history = currentChatHistory;
            }
            localStorage.setItem('chats_v2', JSON.stringify(chats));
            renderHistoryList();
        }
    }

    function loadChat(chatId) {
        saveState();
        const chat = chats.find(c => c.id === chatId);
        if(chat) {
            currentChatId = chatId;
            currentChatHistory = chat.history;
            chatContainer.innerHTML = '';
            currentChatHistory.forEach(msg => addMessageToDOM(msg.text, msg.type, false));
            renderMathInElement(chatContainer, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
            renderHistoryList();
        }
        closeSidebar();
    }

    function startNewChat() {
        saveState();
        currentChatHistory = [];
        currentChatId = null;
        chatContainer.innerHTML = document.getElementById('welcome-screen').outerHTML;
        document.getElementById('welcome-screen').style.display = 'flex';
        renderHistoryList();
        closeSidebar();
    }

    function renderHistoryList() {
        const container = document.getElementById('history-container');
        const header = container.querySelector('div'); // Keep label
        container.innerHTML = '';
        container.appendChild(header);
        
        chats.slice().reverse().forEach(chat => {
            const btn = document.createElement('button');
            const isActive = chat.id === currentChatId;
            btn.className = `w-full text-left py-2 px-3 text-xs font-mono rounded transition mb-1 truncate ${isActive ? 'bg-zinc-200 dark:bg-zinc-800 text-accent' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300'}`;
            btn.textContent = `> ${chat.name}`;
            btn.onclick = () => loadChat(chat.id);
            container.appendChild(btn);
        });
    }

    /* --- MESSAGING --- */
    function addMessageToDOM(text, type, animate = false) {
        const isUser = type === 'user';
        const row = document.createElement('div');
        row.className = `flex w-full mb-4 ${isUser ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        // Technical design: User = Solid Accent, Bot = Transparent with Border
        bubble.className = `max-w-[85%] md:max-w-[70%] p-4 rounded-lg text-sm shadow-sm prose dark:prose-invert overflow-hidden ${
            isUser 
            ? 'bg-accent text-black font-medium rounded-br-none' 
            : 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-bl-none'
        }`;

        if(isUser) {
            bubble.innerHTML = marked.parse(text);
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            scrollToBottom();
        } else {
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            if(animate) {
                typeEffect(bubble, text);
            } else {
                bubble.innerHTML = marked.parse(text);
                renderMathInElement(bubble);
            }
        }
    }

    function typeEffect(element, text) {
        element.classList.add('cursor-block');
        let i = 0;
        // Simple typing for performance
        const interval = setInterval(() => {
            element.textContent = text.substring(0, i+1);
            scrollToBottom();
            i++;
            if(i === text.length) {
                clearInterval(interval);
                element.innerHTML = marked.parse(text);
                element.classList.remove('cursor-block');
                renderMathInElement(element, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
            }
        }, 15);
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleSend() {
        const text = userInput.value.trim();
        const imgDiv = document.getElementById('image-preview');
        if (!text && imgDiv.innerHTML === '') return;

        const welcome = document.getElementById('welcome-screen');
        if(welcome) welcome.remove();

        let msg = text;
        if(imgDiv.innerHTML !== '') msg = `[IMAGE_UPLOAD] ${text}`;

        addMessageToDOM(msg, 'user');
        currentChatHistory.push({text: msg, type: 'user'});
        saveState();

        // Cleanup Input
        userInput.value = '';
        userInput.style.height = 'auto';
        imgDiv.innerHTML = '';
        sendButton.disabled = true;

        // Sim Response
        setTimeout(() => {
            const response = generateResponse(msg);
            addMessageToDOM(response, 'bot', true);
            currentChatHistory.push({text: response, type: 'bot'});
            saveState();
        }, 500);
    }

    function generateResponse(input) {
        const l = input.toLowerCase();
        if(l.includes('hello')) return "System Online. I am the **Obsidian v2** Interface. \n\nDesign parameters:\n- Floating Dock\n- Dot-Grid Background\n- Monospace Font Stack";
        if(l.includes('code')) return "```javascript\nconst aesthetics = {\n  style: 'Technical',\n  theme: 'Dark/Emerald'\n};\nconsole.log('Ready');\n```";
        return `Input received: **${input}**. \n\nProcessed locally. Data persists in \`localStorage\`.`;
    }

    /* --- EVENT LISTENERS --- */
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        sendButton.disabled = !this.value.trim();
    });
    
    userInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });

    sendButton.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', startNewChat);

    // Sidebar & Modals
    const toggleSidebar = () => {
        sidebar.classList.toggle('-translate-x-full');
        sidebarOverlay.classList.toggle('hidden');
    };
    const closeSidebar = () => {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
    }

    document.getElementById('open-sidebar-btn').addEventListener('click', toggleSidebar);
    document.getElementById('close-sidebar-btn')?.addEventListener('click', toggleSidebar); // If added in future
    sidebarOverlay.addEventListener('click', closeSidebar);

    document.getElementById('contact-toggle-btn').addEventListener('click', () => contactModal.classList.remove('hidden'));
    document.getElementById('close-contact-modal-btn').addEventListener('click', () => contactModal.classList.add('hidden'));
    
    document.getElementById('clear-storage-btn').addEventListener('click', () => document.getElementById('confirmation-modal').classList.remove('hidden'));
    document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('confirmation-modal').classList.add('hidden'));
    document.getElementById('modal-confirm').addEventListener('click', () => { localStorage.clear(); location.reload(); });

    // File Upload
    const fileInput = document.getElementById('file-input');
    document.getElementById('attach-button').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const div = document.getElementById('image-preview');
                div.innerHTML = `<div class="relative inline-block border border-zinc-300 dark:border-zinc-600 rounded-lg overflow-hidden"><img src="${ev.target.result}" class="h-12 w-12 object-cover"><button onclick="this.parentElement.parentElement.innerHTML=''" class="absolute top-0 right-0 bg-black/50 text-white w-4 h-4 flex items-center justify-center text-[10px] hover:bg-red-500">&times;</button></div>`;
                sendButton.disabled = false;
            };
            reader.readAsDataURL(file);
        }
    });

    // Init
    initTheme();
    if(chats.length > 0) loadChat(chats[chats.length-1].id);
</script>
</body>
</html>
